<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Northstar native Platform 11 architecture</title>
<desc id="desc">Platform SSO protects Copilot and the presenter guide. Copilot binds the model, native Agent Memory and Credential Store. MCP Gateway routes catalog requests to Market and optional user OAuth requests through an internal relay to Tanzu Hub. Each deployment owns its own service instances.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#46675e" stroke-width="1.4"/></marker></defs>
