<text x="777" y="220" font-size="19" font-weight="700">Model service</text><text x="777" y="246" font-size="14">Your configured model</text>
<text x="175" y="384" font-size="19" font-weight="700">Presenter guide</text><text x="175" y="410" font-size="14">SSO · prompts and launch links</text>
<text x="460" y="384" font-size="19" font-weight="700">MCP Gateway</text><text x="460" y="410" font-size="14">Separate paths per tool</text>
<text x="777" y="384" font-size="19" font-weight="700">Northstar Market</text><text x="777" y="410" font-size="14">Synthetic catalog MCP + UI</text>
<text x="175" y="560" font-size="19" font-weight="700">Agent Memory</text><text x="175" y="588" font-size="14">Native binding · user identity</text><text x="175" y="609" font-size="13">Recall across conversations</text>
