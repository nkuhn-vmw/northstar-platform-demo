spring:
  application:
    name: northstar-market
  datasource:
    url: jdbc:h2:mem:northstar;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never

management:
  health:
    redis:
      enabled: ${NORTHSTAR_REDIS_HEALTH_ENABLED:false}
    rabbit:
      enabled: ${NORTHSTAR_RABBIT_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: Northstar Market
    purpose: Enterprise omnichannel grocery commerce demo

northstar:
  cart:
    store: ${NORTHSTAR_CART_STORE:memory}
    ttl: ${NORTHSTAR_CART_TTL:7d}
  events:
    publisher: ${NORTHSTAR_EVENTS_PUBLISHER:log}
    exchange: ${NORTHSTAR_EVENTS_EXCHANGE:northstar.events}
  advisor:
    engine: ${NORTHSTAR_ADVISOR_ENGINE:rules}
